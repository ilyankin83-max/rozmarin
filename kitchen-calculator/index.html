<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расчёт кухни — Розмарин</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script><style>body{margin:0;background:#272a29}main{width:100%;margin:0}</style></head><body><main><section class="rm-kitchen" aria-label="Расчёт стоимости кухни">
  <div class="rm-kitchen__container">
  <div class="rm-kitchen__content">
    <p class="rm-kitchen__eyebrow">Онлайн-расчёт</p>
    <h2 class="rm-kitchen__title">Сколько будет стоить ваша кухня?</h2>
    <p class="rm-kitchen__text">Укажите параметры вашей кухни, чтобы получить предварительный расчёт.</p>
    <button class="rm-kitchen__button" type="button" data-kitchen-open="kitchen-calculator-popup" aria-haspopup="dialog" aria-controls="kitchen-calculator-popup">
      <span>Рассчитать стоимость кухни</span>
      <svg width="28" height="24" viewBox="0 0 28 24" fill="none" aria-hidden="true"><path d="M2 12h23M17 4l8 8-8 8" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <p class="rm-kitchen__note">Точная стоимость зависит от материалов и комплектации</p>
  </div>
  <div class="rm-kitchen__visual">
    <img class="rm-kitchen__image skiplazy" src="images/kitchen.webp" width="666" height="550" alt="Светлая кухня с деревянными фасадами и островом" loading="lazy" decoding="async">
  </div>
  </div>
</section>
<dialog id="kitchen-calculator-popup" class="rm-kitchen-dialog" aria-labelledby="kitchen-dialog-title">
  <div class="rm-kitchen-dialog__header"><h2 id="kitchen-dialog-title" class="rm-kitchen-dialog__title">Расчёт стоимости кухни</h2><button type="button" class="rm-kitchen-dialog__close" data-kitchen-close aria-label="Закрыть окно" autofocus>×</button></div>
  <!-- Replace this demo paragraph with your existing kitchen calculator. -->
  <p>Демонстрация всплывающего окна. При установке сюда подключается ваш действующий калькулятор кухни.</p>
</dialog></main></body></html>
